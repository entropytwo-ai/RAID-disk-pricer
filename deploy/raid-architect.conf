# RAID Architect — nginx vhost (Pattern A reverse proxy) — friendly hostname
# Public URL: https://raid-architect.abacusai.cloud  ->  server_name raid-architect.vm.internal
# Symlinked into /etc/nginx/conf.d/raid-architect.conf
server {
    listen 80;
    server_name raid-architect.vm.internal;

    # CDN/browser caching: revalidate HTML quickly; static assets use ?v= query busting.
    add_header Cache-Control "max-age=0, s-maxage=60";
    # Allow the apps.abacus.ai iframe preview to render (no X-Frame-Options).
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.abacus.ai";

    location / {
        proxy_pass http://127.0.0.1:8137;
        proxy_set_header Host $http_x_original_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
